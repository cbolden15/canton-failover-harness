name: Publish interactive diagram
on:
  push:
    branches: [main]
    paths:
      - docs/diagrams/architecture.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage the standalone diagram
        run: |
          mkdir -p _site
          cp docs/diagrams/architecture.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy diagram
        id: deployment
        uses: actions/deploy-pages@v4
